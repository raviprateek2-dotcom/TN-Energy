name: Production Quality & Security CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit-and-verify:
    name: TypeScript, Domain Tests & Turbopack Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Static Typecheck (Zero Errors Mandate)
        run: npx tsc --noEmit

      - name: Execute Full Domain, Accessibility & Integration Test Suite
        run: node --experimental-strip-types --test tests/*.test.ts

      - name: Build Next.js Production Assets (Turbopack)
        run: npm run build
